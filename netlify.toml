[build]
 base = "."         
  publish = "dist"   
  command = "npm run build"  

[build.environment]
  NODE_VERSION = "20"
  # EMAIL_TO is a public contact address rendered in the site footer.
  SECRETS_SCAN_OMIT_KEYS = "EMAIL_TO"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["nodemailer"]

[[redirects]]
  from = "/api/send-email"
  to = "/.netlify/functions/send-email"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
